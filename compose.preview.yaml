name: partdb-mechanical-preview

services:
  postgres:
    image: postgres:16-alpine
    container_name: partdb-mechanical-preview-postgres
    environment:
      POSTGRES_DB: partdb
      POSTGRES_USER: partdb
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-partdb-preview}"
    volumes:
      - partdb_mechanical_preview_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partdb -d partdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  partdb:
    image: ghcr.io/aglelectronics/part-db-server:mechanical-v1.4.0
    pull_policy: always
    container_name: partdb-mechanical-preview
    ports:
      - "${PARTDB_PORT:-8080}:80"
    environment:
      APP_ENV: docker
      APP_DEBUG: "0"
      APP_SECRET: "${APP_SECRET:-mechanical-preview-change-me}"
      DATABASE_URL: "postgresql://partdb:${POSTGRES_PASSWORD:-partdb-preview}@postgres:5432/partdb?serverVersion=16&charset=utf8"
      DB_AUTOMIGRATE: "true"
      DEFAULT_LANG: "${DEFAULT_LANG:-en}"
      DEFAULT_TIMEZONE: "${DEFAULT_TIMEZONE:-UTC}"
      BASE_CURRENCY: "${BASE_CURRENCY:-EUR}"
      INSTANCE_NAME: "Mechanical Parts Preview"
      CHECK_FOR_UPDATES: "0"
      ALLOW_ATTACHMENT_DOWNLOADS: "0"
      PROVIDER_LAPP_ENABLED: "1"
      PROVIDER_LAPP_HALOGEN_FREE_ENABLED: "1"
      PROVIDER_LAPP_AUTOMOTIVE_ENABLED: "1"
    volumes:
      - partdb_mechanical_preview_data:/var/www/html/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  partdb_mechanical_preview_data:
    name: partdb_mechanical_preview_data
  partdb_mechanical_preview_postgres:
    name: partdb_mechanical_preview_postgres
