name: Images

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'mechanical-v*'
  workflow_dispatch:
    inputs:
      track:
        description: Which image to build
        required: true
        default: test
        type: choice
        options:
          - test
          - prod
      version_tag:
        description: Extra production tag, for example mechanical-v1.6.3
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-image:
    name: Test image
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.track == 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aglelectronics/part-db-server
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=test-${{ github.ref_name }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Part-DB test image
            org.opencontainers.image.description=Part-DB image built to try a branch before it is released
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and publish test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=test-image
          cache-to: type=gha,mode=max,scope=test-image

  prod-image:
    name: Production image
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/mechanical-v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.track == 'prod')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aglelectronics/part-db-server
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=mechanical-preview,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=raw,value=${{ inputs.version_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version_tag != '' }}
          labels: |
            org.opencontainers.image.title=Part-DB
            org.opencontainers.image.description=Part-DB with the mechanical parts library
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and publish production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod-image
          cache-to: type=gha,mode=max,scope=prod-image
          provenance: mode=max
          sbom: true
