name: Mechanical Preview Image

on:
  push:
    branches:
      - cursor/mechanical-stock-release-d305
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mechanical-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build preview image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aglelectronics/part-db-server
          tags: |
            type=raw,value=mechanical-v1.2.1
            type=raw,value=mechanical-preview
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Part-DB Mechanical Preview
            org.opencontainers.image.description=Part-DB preview with the mechanical parts library
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=mechanical-v1.2.1

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mechanical-preview
          cache-to: type=gha,mode=max,scope=mechanical-preview
          provenance: mode=max
          sbom: true
